name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [expenses, settlements]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests with coverage (fails under 70%)
        run: pytest

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Build image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} .

  # Single status check to require in branch protection.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: service
    if: always()
    steps:
      - name: Check all service jobs succeeded
        run: test "${{ needs.service.result }}" = "success"
