<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splitwise-lite</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      .status { font-weight: 600; }
      .up { color: #1a7f37; }
      .down { color: #cf222e; }
      .note { color: #6e7781; font-size: 0.9rem; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #d0d7de; }
      .amount { text-align: right; font-variant-numeric: tabular-nums; }
      tfoot td { font-weight: 600; border-bottom: none; }
    </style>
  </head>
  <body>
    <h1>Splitwise-lite</h1>
    <p>Split shared expenses and settle up with the fewest transfers.</p>
    <ul>
      <li>expenses-service: <span id="expenses-status" class="status">checking…</span></li>
      <li>settlements-service: <span id="settlements-status" class="status">checking…</span></li>
    </ul>

    <section id="group">
      <h2 id="group-name">Loading group…</h2>
      <p class="note">Sample data until the expenses API is ready.</p>

      <h3>Members</h3>
      <ul id="member-list"></ul>

      <h3>Expenses</h3>
      <table>
        <thead>
          <tr><th>Description</th><th>Paid by</th><th class="amount">Amount</th></tr>
        </thead>
        <tbody id="expense-rows"></tbody>
        <tfoot>
          <tr><td colspan="2">Total</td><td id="expense-total" class="amount"></td></tr>
        </tfoot>
      </table>
    </section>

    <script src="config.js"></script>
    <script src="fake-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
